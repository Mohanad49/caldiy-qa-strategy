name: caldiy-qa-strategy

services:
  postgres:
    image: postgres:16-bookworm@sha256:92620daddcd947f8d5ab5ba66e848702fe443d87fed30c4cea8e389fd78dfc55
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.27.5@sha256:5921fa3c3f0a34eb000a89ac8279d1f9d711e486a9a8fd094f7db5a1920256ab
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  caldiy:
    image: calcom.docker.scarf.sh/calcom/cal.com:v6.2.0@sha256:ace3bb1219fb7306585ab9f4d94d41af7ee064c343db0498173436bbe857bd49
    platform: linux/amd64
    ports:
      - "127.0.0.1:${CALDIY_WEB_PORT}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_HOST: postgres:5432
      NEXT_PUBLIC_WEBAPP_URL: http://localhost:${CALDIY_WEB_PORT}
      NEXTAUTH_URL: http://localhost:${CALDIY_WEB_PORT}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      CALCOM_TELEMETRY_DISABLED: "1"
      EMAIL_SERVER_HOST: mailpit
      EMAIL_SERVER_PORT: "1025"
      EMAIL_FROM: notifications@caldiy.test
      EMAIL_FROM_NAME: Cal.diy QA
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  redis:
    profiles: ["api"]
    image: redis:7.4.10-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api-v2:
    profiles: ["api"]
    image: caldiy-api-v2:6.2.0-local
    platform: linux/amd64
    ports:
      - "127.0.0.1:${CALDIY_API_PORT}:5555"
    environment:
      NODE_ENV: development
      API_PORT: "5555"
      API_URL: http://localhost
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_READ_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_WRITE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      USE_POOL: "true"
      REDIS_URL: redis://redis:6379
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      JWT_SECRET: ${API_V2_JWT_SECRET}
      CALENDSO_ENCRYPTION_KEY: ${CALENDSO_ENCRYPTION_KEY}
      CALCOM_SERVICE_ACCOUNT_ENCRYPTION_KEY: ${CALCOM_SERVICE_ACCOUNT_ENCRYPTION_KEY}
      EMAIL_SERVER_HOST: mailpit
      EMAIL_SERVER_PORT: "1025"
      EMAIL_FROM: notifications@caldiy.test
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      WEB_APP_URL: http://localhost:${CALDIY_WEB_PORT}/
      CALCOM_LICENSE_KEY: ${CALCOM_LICENSE_KEY}
      API_KEY_PREFIX: cal_
      IS_E2E: "true"
      DOCS_URL: ""
      NEXT_PUBLIC_SENTRY_DSN: ""
      SENTRY_DSN: ""
      REWRITE_API_V2_PREFIX: "0"
      ENABLE_ASYNC_TASKER: "false"
      CALCOM_TELEMETRY_DISABLED: "1"
      LOGGER_BRIDGE_LOG_LEVEL: "2"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      caldiy:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:5555/health"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
    name: caldiy-qa-strategy-postgres-data
