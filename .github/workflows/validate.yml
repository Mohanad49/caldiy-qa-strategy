name: Phase 1 validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate configuration, documentation and secret boundaries
        run: make validate
