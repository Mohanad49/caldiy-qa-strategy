name: Cal.diy QA

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caldiy-qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"
  CALDIY_SOURCE_SHA: 1c193cca8682b33b9866c792186033f7ef886682

jobs:
  validate:
    name: Repository contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked validation dependencies
        run: |
          uv sync --frozen --python 3.12
          pnpm install --frozen-lockfile
      - name: Validate configuration, documentation, suites and secret boundaries
        run: make validate

  prewarm_api:
    name: Prewarm private API v2 Buildx cache
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      heap_mb: ${{ steps.api_image.outputs.heap_mb }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build exact-source API image into runner-local Docker
        id: api_image
        uses: ./.github/actions/api-image
        with:
          load_image: "false"
          write_cache: "true"
      - name: Confirm no distributable image was published
        run: |
          if docker image inspect caldiy-api-v2:6.2.0-local >/dev/null 2>&1; then
            echo "::error::The cache-only prewarm unexpectedly loaded an API image."
            exit 1
          fi
          echo "API v2 layers were written only to the GitHub Actions cache; no runtime image or registry output was produced." >> "$GITHUB_STEP_SUMMARY"

  api:
    name: API smoke, contracts and suite
    needs: prewarm_api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
      - name: Install locked Python dependencies
        run: uv sync --frozen --python 3.12
      - name: Rebuild API image from the prewarmed cache
        uses: ./.github/actions/api-image
        with:
          heap_mb: ${{ needs.prewarm_api.outputs.heap_mb }}
      - name: Start isolated SUT and verify live API smoke
        run: ./scripts/ci-sut-bootstrap.sh
      - name: Verify the live controlled contract
        run: make contracts-verify
      - name: Run the API suite
        if: github.event_name != 'pull_request'
        id: api_runs
        shell: bash
        run: |
          set +e
          QA_RUN_ID="ci-${GITHUB_RUN_ID}-api-1" make test-api
          first_status=$?
          set -e
          mkdir -p test-results/api-runs/run-1 allure-results
          if [[ -s test-results/api/junit.xml ]]; then
            cp test-results/api/junit.xml test-results/api-runs/run-1/junit.xml
            echo "run_1_report=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -d allure-results/api ]]; then
            mv allure-results/api allure-results/api-run-1
          fi

          echo "first_status=${first_status}" >> "$GITHUB_OUTPUT"
      - name: Upload API reports for 30 days
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-reports-${{ github.run_id }}
          path: test-results/api*
          if-no-files-found: warn
          retention-days: 30
      - name: Upload API Allure input for 30 days
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-api-${{ github.run_id }}
          path: allure-results/api-run-*
          if-no-files-found: warn
          retention-days: 30
      - name: Check whether the TestPulse secret exists
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: testpulse_secret
        shell: bash
        env:
          TESTPULSE_DATABASE_URL: ${{ secrets.TESTPULSE_DATABASE_URL }}
        run: |
          if [[ -n "${TESTPULSE_DATABASE_URL}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TESTPULSE_DATABASE_URL is absent; API results were not ingested."
          fi
      - name: Ingest first API run into TestPulse
        if: always() && github.ref == 'refs/heads/main' && steps.testpulse_secret.outputs.present == 'true' && steps.api_runs.outputs.run_1_report == 'true'
        continue-on-error: true
        uses: Mohanad49/testpulse@2696d715e7b18f2ef029e291f37371d6b4bb01fb
        with:
          path: test-results/api-runs/run-1/junit.xml
          format: junit
          suite: caldiy-api-v2
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          comment: "false"
      - name: Enforce API suite outcomes
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          test "${{ steps.api_runs.outputs.first_status }}" = "0"

  api_repeat:
    name: Repeated same-commit API run
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [prewarm_api, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - uses: ./.github/actions/api-image
        with:
          heap_mb: ${{ needs.prewarm_api.outputs.heap_mb }}
      - run: ./scripts/ci-sut-bootstrap.sh
      - name: Run the same API suite again on the same commit
        id: api_repeat_run
        continue-on-error: true
        env:
          QA_RUN_ID: ci-${{ github.run_id }}-api-repeat
        run: make test-api
      - name: Upload repeated-run API reports for 30 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-repeat-reports-${{ github.run_id }}
          path: test-results/api
          if-no-files-found: warn
          retention-days: 30
      - name: Upload repeated-run Allure input for 30 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-api-repeat-${{ github.run_id }}
          path: allure-results/api
          if-no-files-found: warn
          retention-days: 30
      - name: Check whether the TestPulse secret exists
        if: always() && github.ref == 'refs/heads/main'
        id: testpulse_secret
        shell: bash
        env:
          TESTPULSE_DATABASE_URL: ${{ secrets.TESTPULSE_DATABASE_URL }}
        run: |
          if [[ -n "${TESTPULSE_DATABASE_URL}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TESTPULSE_DATABASE_URL is absent; repeated API results were not ingested."
          fi
      - name: Ingest repeated same-commit API run into TestPulse
        if: always() && github.ref == 'refs/heads/main' && steps.api_repeat_run.outcome != 'skipped' && steps.testpulse_secret.outputs.present == 'true'
        continue-on-error: true
        uses: Mohanad49/testpulse@2696d715e7b18f2ef029e291f37371d6b4bb01fb
        with:
          path: test-results/api/junit.xml
          format: junit
          suite: caldiy-api-v2
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          comment: "false"
      - name: Enforce repeated API outcome
        if: always()
        run: test "${{ steps.api_repeat_run.outcome }}" = "success"

  e2e_shard:
    name: Playwright shard ${{ matrix.shard }}/4
    if: github.event_name != 'pull_request'
    needs: prewarm_api
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked test dependencies and browsers
        run: |
          uv sync --frozen --python 3.12
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium firefox
      - name: Rebuild API image from the prewarmed cache
        uses: ./.github/actions/api-image
        with:
          heap_mb: ${{ needs.prewarm_api.outputs.heap_mb }}
      - name: Start isolated SUT
        run: ./scripts/ci-sut-bootstrap.sh
      - name: Run shard into a blob report
        id: shard_run
        continue-on-error: true
        shell: bash
        env:
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          QA_RUN_ID: ci-${{ github.run_id }}-e2e-${{ matrix.shard }}
        run: |
          set -a
          source .env
          set +a
          pnpm exec playwright test \
            --project=chromium-e2e \
            --project=firefox-lifecycle \
            --shard=${{ matrix.shard }}/4 \
            --reporter=blob
      - name: Upload shard blob and attached traces for 14 days
        if: always() && steps.shard_run.outcome != 'skipped'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: error
          retention-days: 14
      - name: Upload unbundled shard failure evidence for 14 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-failure-evidence-${{ matrix.shard }}
          path: test-results/playwright/artifacts
          if-no-files-found: ignore
          retention-days: 14
      - name: Enforce shard outcome after evidence upload
        if: always() && steps.shard_run.outcome != 'skipped'
        run: test "${{ steps.shard_run.outcome }}" = "success"

  merge_e2e:
    name: Merge Playwright shards before reporting
    if: always() && !cancelled() && github.event_name != 'pull_request' && needs.e2e_shard.result != 'skipped'
    needs: e2e_shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download all four blob artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-blob-*
          path: all-blob-reports
          merge-multiple: true
      - name: Reject an incomplete shard set and merge once
        id: merge
        continue-on-error: true
        shell: bash
        run: |
          test "$(find all-blob-reports -type f -name '*.zip' | wc -l | tr -d ' ')" = "4"
          pnpm exec playwright merge-reports --config=playwright.merge.config.ts all-blob-reports
      - name: Upload merged Playwright JSON and JUnit for 30 days
        if: always() && steps.merge.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-merged-reports-${{ github.run_id }}
          path: test-results/e2e
          if-no-files-found: error
          retention-days: 30
      - name: Upload merged E2E Allure input for 30 days
        if: always() && steps.merge.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-e2e-${{ github.run_id }}
          path: allure-results/playwright-e2e
          if-no-files-found: warn
          retention-days: 30
      - name: Check whether the TestPulse secret exists
        if: always() && github.ref == 'refs/heads/main'
        id: testpulse_secret
        shell: bash
        env:
          TESTPULSE_DATABASE_URL: ${{ secrets.TESTPULSE_DATABASE_URL }}
        run: |
          if [[ -n "${TESTPULSE_DATABASE_URL}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TESTPULSE_DATABASE_URL is absent; merged E2E results were not ingested."
          fi
      - name: Ingest only the merged Playwright report into TestPulse
        if: always() && github.ref == 'refs/heads/main' && steps.merge.outcome == 'success' && steps.testpulse_secret.outputs.present == 'true'
        continue-on-error: true
        uses: Mohanad49/testpulse@2696d715e7b18f2ef029e291f37371d6b4bb01fb
        with:
          path: test-results/e2e/playwright.json
          format: playwright
          suite: caldiy-e2e
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          comment: "false"
      - name: Enforce merge outcome
        if: always()
        run: test "${{ steps.merge.outcome }}" = "success"

  browser_quality:
    name: BDD, accessibility and visual gates
    if: github.event_name != 'pull_request'
    needs: prewarm_api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked test dependencies and Chromium
        run: |
          uv sync --frozen --python 3.12
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Rebuild API image from the prewarmed cache
        uses: ./.github/actions/api-image
        with:
          heap_mb: ${{ needs.prewarm_api.outputs.heap_mb }}
      - run: ./scripts/ci-sut-bootstrap.sh
      - name: Run exactly three BDD journeys
        id: bdd
        continue-on-error: true
        run: make test-bdd
      - name: Run unsuppressed accessibility gate
        id: a11y
        continue-on-error: true
        run: make test-a11y
      - name: Run committed Chromium visual comparisons
        id: visual
        continue-on-error: true
        run: ./scripts/browser-test.sh visual
      - name: Upload browser failure evidence for 14 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence-${{ github.run_id }}
          path: test-results/playwright/artifacts
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload BDD, accessibility and visual reports for 30 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-quality-reports-${{ github.run_id }}
          path: |
            test-results/bdd
            test-results/a11y
            test-results/visual
          if-no-files-found: warn
          retention-days: 30
      - name: Upload browser-quality Allure input for 30 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-browser-quality-${{ github.run_id }}
          path: allure-results/playwright
          if-no-files-found: warn
          retention-days: 30
      - name: Check whether the TestPulse secret exists
        if: always() && github.ref == 'refs/heads/main'
        id: testpulse_secret
        shell: bash
        env:
          TESTPULSE_DATABASE_URL: ${{ secrets.TESTPULSE_DATABASE_URL }}
        run: |
          if [[ -n "${TESTPULSE_DATABASE_URL}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TESTPULSE_DATABASE_URL is absent; BDD results were not ingested."
          fi
      - name: Ingest BDD JUnit into TestPulse
        if: always() && github.ref == 'refs/heads/main' && steps.testpulse_secret.outputs.present == 'true'
        continue-on-error: true
        uses: Mohanad49/testpulse@2696d715e7b18f2ef029e291f37371d6b4bb01fb
        with:
          path: test-results/bdd/junit.xml
          format: junit
          suite: caldiy-bdd
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          comment: "false"
      - name: Enforce browser quality outcomes
        if: always()
        shell: bash
        run: |
          test "${{ steps.bdd.outcome }}" = "success"
          test "${{ steps.a11y.outcome }}" = "success"
          test "${{ steps.visual.outcome }}" = "success"

  timezone:
    name: Full pinned-oracle timezone matrix
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [prewarm_api, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: |
          uv sync --frozen --python 3.12
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - uses: ./.github/actions/api-image
        with:
          heap_mb: ${{ needs.prewarm_api.outputs.heap_mb }}
      - run: ./scripts/ci-sut-bootstrap.sh
      - name: Run full timezone matrix
        id: timezone_run
        continue-on-error: true
        run: make test-timezones
      - name: Upload timezone failure evidence for 14 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timezone-failure-evidence-${{ github.run_id }}
          path: test-results/playwright/artifacts
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload timezone reports for 30 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timezone-reports-${{ github.run_id }}
          path: test-results/timezones
          if-no-files-found: warn
          retention-days: 30
      - name: Upload timezone Allure input for 30 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-results-timezone-${{ github.run_id }}
          path: allure-results/playwright
          if-no-files-found: warn
          retention-days: 30
      - if: always()
        run: test "${{ steps.timezone_run.outcome }}" = "success"

  performance:
    name: Local-only k6 gates
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [prewarm_api, api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - uses: ./.github/actions/api-image
        with:
          heap_mb: ${{ needs.prewarm_api.outputs.heap_mb }}
      - run: ./scripts/ci-sut-bootstrap.sh
      - name: Run availability and unique-booking gates
        id: perf
        continue-on-error: true
        run: make test-perf
      - name: Run 20-way capacity-one contention gate
        id: contention
        continue-on-error: true
        run: make test-contention
      - name: Merge honest threshold outcomes for TestPulse
        id: merge_performance
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t junit_files < <(find test-results/performance -type f -name junit.xml | sort)
          test "${#junit_files[@]}" = "2"
          uv run --frozen python scripts/merge_junit.py \
            --suite caldiy-performance-gates \
            --output test-results/performance/junit.xml \
            "${junit_files[@]}"
      - name: Upload k6 summaries, raw results, metadata and JUnit for 30 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-evidence-${{ github.run_id }}
          path: test-results/performance
          if-no-files-found: error
          retention-days: 30
      - name: Check whether the TestPulse secret exists
        if: always() && github.ref == 'refs/heads/main'
        id: testpulse_secret
        shell: bash
        env:
          TESTPULSE_DATABASE_URL: ${{ secrets.TESTPULSE_DATABASE_URL }}
        run: |
          if [[ -n "${TESTPULSE_DATABASE_URL}" ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TESTPULSE_DATABASE_URL is absent; performance gates were not ingested."
          fi
      - name: Ingest performance gate outcomes into TestPulse
        if: always() && github.ref == 'refs/heads/main' && steps.merge_performance.outcome == 'success' && steps.testpulse_secret.outputs.present == 'true'
        continue-on-error: true
        uses: Mohanad49/testpulse@2696d715e7b18f2ef029e291f37371d6b4bb01fb
        with:
          path: test-results/performance/junit.xml
          format: junit
          suite: caldiy-performance-gates
          database-url: ${{ secrets.TESTPULSE_DATABASE_URL }}
          comment: "false"
      - name: Enforce performance outcomes after evidence and ingestion
        if: always()
        shell: bash
        run: |
          test "${{ steps.perf.outcome }}" = "success"
          test "${{ steps.contention.outcome }}" = "success"
          test "${{ steps.merge_performance.outcome }}" = "success"

  upstream_advisory:
    name: Current public Cal.diy contract advisory
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - name: Compare used operations without changing the controlled SUT
        id: advisory
        continue-on-error: true
        run: ./scripts/current-upstream-advisory.sh
      - name: Publish advisory in the workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -s test-results/contracts/current-upstream/summary.md ]]; then
            cat test-results/contracts/current-upstream/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Current-upstream advisory produced no report."
          fi
      - name: Upload informational advisory for 30 days
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-upstream-advisory-${{ github.run_id }}
          path: test-results/contracts/current-upstream
          if-no-files-found: warn
          retention-days: 30

  allure:
    name: Merged Allure report artifact
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      (needs.api.result != 'skipped' || needs.merge_e2e.result != 'skipped' ||
      needs.browser_quality.result != 'skipped' || needs.timezone.result != 'skipped')
    needs: [api, api_repeat, merge_e2e, browser_quality, timezone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: Download all available raw Allure inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Generate one merged static report
        run: ./scripts/generate-allure-report.sh
      - name: Upload merged Allure report for 30 days
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: error
          retention-days: 30
